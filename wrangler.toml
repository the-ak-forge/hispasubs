# Configuración del Worker (Cloudflare).
# Antes se desplegaba con argumentos sueltos: `npx wrangler deploy worker.js
# --name hispasubs`; ahora basta `npx wrangler deploy` (lee este fichero).
name = "hispasubs"
main = "worker.js"
compatibility_date = "2026-10-01"
# Sin Preview URLs: es un addon en producción, y las variantes
# *.hispasubs.ak-forge.workers.dev solo añaden confusión (y wrangler las
# habilita por defecto si no se declara esta opción).
workers_dev = true
preview_urls = false

# workers_dev es true por defecto: sigue publicando en hispasubs.ak-forge.workers.dev

# Assets estáticos (Workers Static Assets): /logo.svg y /favicon.ico se sirven
# desde el borde SIN invocar al Worker -> requests gratis e ilimitados y sin
# eventos en Workers Logs. Importante: el logo lo hotlinkea stremio-addons.net
# y concentra >50 % del tráfico (~37k req/día); servido como asset no consume
# la cota Free de 100k req/día ni ensucia los logs. Si una ruta no coincide
# con ningún fichero de public/, Cloudflare ejecuta el Worker normalmente
# (subtitles, manifest, configure...), así que el router de worker.js sigue
# siendo el encargado de todo lo dinámico. La ruta /logo.svg de worker.js
# queda como fallback muerto (nunca se ejecuta: el asset se sirve antes).
[assets]
directory = "./public"

# Rate Limiting nativo (Workers Rate Limiting API) — disponible en Free plan.
# Solo aplica a peticiones SIN caché (subtitles/manifest dinámicos). Usa la
# clave cf-connecting-ip. Periodo fijo 60 s; RATE_LIMIT controla el tope (0 = off).
[[ratelimits]]
name = "SUBS_RATE_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 120
  period = 60

# Observabilidad (Workers Logs + Workers Traces) — requiere redespliegue para
# aplicarse. Logs: invocación + console.log/error en el dashboard (Workers &
# Pages -> hispasubs -> Observability). Traces: spans automáticos de cada
# subrequest saliente (API de OpenSubtitles/SubDL y descargas vía proxy) sin
# tocar código — útiles para medir duración/latencia por fuente.
# Presupuesto Free: 200k eventos de log/día (retención 3 días); las rutas
# /logo.svg y /favicon.ico son assets y NO generan invocaciones. Ojo: desde
# el 1/12/2026 Workers Logs/Traces pasan a la precios de Cloudflare
# Observability — vigilar el volumen ese mes.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

# Variables opcionales (descomentar para cambiar los valores por defecto):
#
# [vars]
# RATE_LIMIT = "120"   # Solo vale para el fallback in-memory (tests/entornos
#                      # sin binding). 0 = desactiva el límite por completo,
#                      # incluso con el binding [[ratelimits]] de arriba.
#                      # Para SUBIR el límite en producción hay que editar
#                      # [[ratelimits]] simple.limit (el valor de esta variable
#                      # NO lo cambia: el binding manda). Si algún usuario
#                      # reporta 429s (típico tras CGNAT de operadora, donde
#                      # muchos comparten IP), sube simple.limit y redespliega.
